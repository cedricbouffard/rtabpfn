name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy pkgdown
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        env:
          TABPFN_NO_BROWSER: "true"
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch numpy pandas scikit-learn scipy lightgbm
          pip install tabpfn

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::remotes
          needs: website

      - name: Reuse pre-rendered articles
        run: |
          # The vignettes need the TabPFN model (weights + license), which is not
          # available in CI, so their figures are pre-rendered and committed
          # under docs/articles/. Backdate the sources so pkgdown's lazy build
          # keeps the committed HTML instead of re-knitting code-only pages.
          # Remember to rebuild docs/ locally when you change a vignette.
          find vignettes -name '*.Rmd' -exec touch -d '2000-01-01T00:00:00Z' {} +

      - name: Build pkgdown site
        run: |
          Rscript -e 'options(pkgdown.internet = TRUE); pkgdown::build_site()'

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
